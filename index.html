<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKL TDM Assist</title>
    <style>
        :root { --dark: #0f172a; --bg: #f1f5f9; --blue: #3b82f6; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 250px; background: var(--dark); color: white; display: flex; flex-direction: column; }
        .nav-item { padding: 15px 25px; cursor: pointer; border-bottom: 1px solid #1e293b; font-size: 0.9rem; }
        .nav-item:hover { background: #1e293b; }
        .main { flex: 1; overflow-y: auto; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 800px; margin: auto; }
        .page { display: none; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        label { font-size: 0.7rem; font-weight: bold; display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; background: #fffde7; }
        .res-box { background: #f8fafc; padding: 15px; border-radius: 5px; border: 1px solid #eee; margin-top: 10px; }
        .res-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #eee; }
        .bold { font-weight: bold; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div style="padding: 20px; font-weight: bold; border-bottom: 1px solid #334155;">HKL TDM</div>
        <div class="nav-item" onclick="go('dash')">Dashboard</div>
        <div class="nav-item" onclick="go('wt')">Weight Calc</div>
        <div class="nav-item" onclick="go('cr')">CrCl Calc</div>
        <div class="nav-item" onclick="go('v1')">Vanco Pre-Post</div>
        <div class="nav-item" onclick="go('v2')">Vanco Pre-Only</div>
    </div>
    <div class="main">
        <div id="p-dash" class="page" style="display:block">
            <h2>Dashboard</h2>
            <p>Select a tool from the sidebar to begin.</p>
        </div>
        <div id="p-wt" class="page">
            <div class="card">
                <h3>Dosing Weight</h3>
                <div class="grid">
                    <div><label>Weight (kg)</label><input type="number" id="w" oninput="cw()"></div>
                    <div><label>Height (cm)</label><input type="number" id="h" oninput="cw()"></div>
                    <div><label>Gender</label><select id="g" onchange="cw()"><option value="M">Male</option><option value="F">Female</option></select></div>
                </div>
                <div class="res-box">
                    <div class="res-row"><span>BMI</span><span id="r-bmi" class="bold">---</span></div>
                    <div class="res-row"><span>IBW</span><span id="r-ibw" class="bold">---</span></div>
                    <div class="res-row"><span>AdjBW</span><span id="r-adj" class="bold">---</span></div>
                </div>
            </div>
        </div>
        <div id="p-cr" class="page">
            <div class="card">
                <h3>CrCl (Cockcroft-Gault)</h3>
                <div class="grid">
                    <div><label>Weight (kg)</label><input type="number" id="cw" oninput="cc()"></div>
                    <div><label>Age</label><input type="number" id="ca" oninput="cc()"></div>
                    <div><label>SCr (umol/L)</label><input type="number" id="cs" oninput="cc()"></div>
                    <div><label>Gender</label><select id="cg" onchange="cc()"><option value="M">Male</option><option value="F">Female</option></select></div>
                </div>
                <div class="res-box">
                    <div class="res-row"><span>CrCl (ml/min)</span><span id="r-cr" class="bold">---</span></div>
                </div>
            </div>
        </div>
        <div id="p-v1" class="page">
            <div class="card">
                <h3>Vanco Pre-Post</h3>
                <div class="grid">
                    <div><label>Pre Level</label><input type="number" id="v1-1" oninput="cv1()"></div>
                    <div><label>Post Level</label><input type="number" id="v1-2" oninput="cv1()"></div>
                    <div><label>Weight</label><input type="number" id="v1-3" oninput="cv1()"></div>
                    <div><label>Dose</label><input type="number" id="v1-4" oninput="cv1()"></div>
                    <div><label>Interval</label><input type="number" id="v1-5" oninput="cv1()"></div>
                    <div><label>Infusion</label><input type="number" id="v1-6" oninput="cv1()"></div>
                    <div><label>Inf. End</label><input type="number" id="v1-7" oninput="cv1()"></div>
                    <div><label>Pre-Time</label><input type="number" id="v1-8" oninput="cv1()"></div>
                    <div><label>Post-Time</label><input type="number" id="v1-9" oninput="cv1()"></div>
                </div>
                <div class="res-box">
                    <div class="res-row"><span>Ke</span><span id="o1-ke" class="bold">---</span></div>
                    <div class="res-row"><span>AUC24</span><span id="o1-au" class="bold" style="color:blue">---</span></div>
                </div>
            </div>
        </div>
        <div id="p-v2" class="page">
            <div class="card">
                <h3>Vanco Pre-Only</h3>
                <label>Method</label>
                <select id="v2-m" onchange="cv2()"><option value="E">Prior Ke</option><option value="B">Bolus</option></select>
                <div class="grid" style="margin-top:10px">
                    <div><label>Prior Ke</label><input type="number" id="v2-k" oninput="cv2()"></div>
                    <div><label>Pre Level</label><input type="number" id="v2-p" oninput="cv2()"></div>
                    <div><label>Weight</label><input type="number" id="v2-w" oninput="cv2()"></div>
                    <div><label>Vd (L/kg)</label><input type="number" id="v2-v" oninput="cv2()"></div>
                    <div><label>Dose</label><input type="number" id="v2-d" oninput="cv2()"></div>
                    <div><label>Interval</label><input type="number" id="v2-i" oninput="cv2()"></div>
                    <div><label>Infusion</label><input type="number" id="v2-f" oninput="cv2()"></div>
                    <div><label>Delta T</label><input type="number" id="v2-t" oninput="cv2()"></div>
                </div>
                <div class="res-box">
                    <div class="res-row"><span>Ke</span><span id="o2-ke" class="bold">---</span></div>
                    <div class="res-row"><span>AUC24</span><span id="o2-au" class="bold" style="color:blue">---</span></div>
                </div>
            </div>
        </div>
    </div>
    <script>
        function go(id) {
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            document.getElementById('p-' + id).style.display = 'block';
        }
        function cw() {
            let w = parseFloat(document.getElementById('w').value), h = parseFloat(document.getElementById('h').value), g = document.getElementById('g').value;
            if (w && h) {
                let b = w / ((h / 100) ** 2), i = (g == "M") ? (50 + 0.9 * (h - 152)) : (45.5 + 0.9 * (h - 152));
                document.getElementById('r-bmi').innerText = b.toFixed(2);
                document.getElementById('r-ibw').innerText = i.toFixed(2);
                document.getElementById('r-adj').innerText = (i + 0.4 * (w - i)).toFixed(2);
            }
        }
        function cc() {
            let w = parseFloat(document.getElementById('cw').value), a = parseFloat(document.getElementById('ca').value), s = parseFloat(document.getElementById('cs').value), g = document.getElementById('cg').value;
            if (w && a && s) {
                let f = (g == "M") ? 1.23 : 1.04;
                document.getElementById('r-cr').innerText = (((140 - a) * w * f) / s).toFixed(2);
            }
        }
        function cv1() {
            let c1=parseFloat(document.getElementById('v1-1').value), c2=parseFloat(document.getElementById('v1-2').value), w=parseFloat(document.getElementById('v1-3').value), d=parseFloat(document.getElementById('v1-4').value), t=parseFloat(document.getElementById('v1-5').value), i=parseFloat(document.getElementById('v1-6').value), e=parseFloat(document.getElementById('v1-7').value), s1=parseFloat(document.getElementById('v1-8').value), s2=parseFloat(document.getElementById('v1-9').value);
            if (c1 && c2 && w && d && t) {
                let ke = (Math.log(c2) - Math.log(c1)) / (t - (s2 - s1));
                let cx = c2 * Math.exp(ke * (s2 - e)), cn = cx * Math.exp(-ke * (t - i));
                let au = ((i * (cn + cx) / 2) + ((cx - cn) / ke)) * (24 / t);
                document.getElementById('o1-ke').innerText = ke.toFixed(4);
                document.getElementById('o1-au').innerText = au.toFixed(2);
            }
        }
        function cv2() {
            let cp=parseFloat(document.getElementById('v2-p').value), w=parseFloat(document.getElementById('v2-w').value), vk=parseFloat(document.getElementById('v2-v').value), d=parseFloat(document.getElementById('v2-d').value), t=parseFloat(document.getElementById('v2-i').value), f=parseFloat(document.getElementById('v2-f').value), dt=parseFloat(document.getElementById('v2-t').value), m=document.getElementById('v2-m').value;
            if (cp && w && vk && d && t) {
                let ke, cx, cn;
                if (m == 'E') {
                    ke = parseFloat(document.getElementById('v2-k').value); if (!ke) return;
                    cx = cp * Math.exp(ke * (t - f - dt)); cn = cp * Math.exp(-ke * dt);
                } else {
                    cx = cp + (d / (vk * w)); ke = (Math.log(cx) - Math.log(cp)) / (t - dt); cn = cp;
                }
                let au = ((f * (cx + cn) / 2) + ((cx - cn) / ke)) * (24 / t);
                document.getElementById('o2-ke').innerText = ke.toFixed(4);
                document.getElementById('o2-au').innerText = au.toFixed(2);
            }
        }
    </script>
</body>
</html>
